title: Su
resolvable: true
navigable: false
contextual: false
anonymous: true
host: /boot/python/runtime
entry:
  run: cap:y5n.caps.ident.apps.su:main
invocation:
  params:
  - key: user
    positional: true
    required: true
  - key: password
    required: true
  - key: administrative
    kind: flag
  - key: temporary
    kind: flag
resources:
  ref: resource:y5n.caps.system.resources.loader:content
  document:
    default:
      path: su/default.ydf
  man:
    default:
      path: su/man.ydf
